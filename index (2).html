<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bank Naratama</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#14233f;--mut:#6b7690;--navy:#16304f;--gold:#4f7d57;--line:#e3e7ef;--ok:#1f9d63;--bad:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1424;--card:#13203a;--tx:#eef2fa;--mut:#93a0ba;--navy:#5f8fd6;--line:#223152}}
:root[data-theme="dark"]{--bg:#0b1424;--card:#13203a;--tx:#eef2fa;--mut:#93a0ba;--navy:#5f8fd6;--line:#223152}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px 16px 110px}
header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
header b{font-size:18px;letter-spacing:.5px}header span{color:var(--gold)}
header .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.hero{background:linear-gradient(135deg,#16304f,#41587a);color:#fff;border:0;position:relative;overflow:hidden}
.hero small{opacity:.75}.hero .bal{font-size:34px;font-weight:800;margin:4px 0 10px}
.hero .rek{display:inline-flex;gap:8px;align-items:center;background:#ffffff22;border-radius:10px;padding:6px 10px;font-weight:600;letter-spacing:1px}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:#4f7d5755}
h3{margin:0 0 12px;font-size:17px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:16px;outline:none}
input:focus{border-color:var(--gold)}
.btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
:root:not([data-theme="dark"]) .btn.g,.btn.g{background:var(--gold);color:#fff}
.btn.s{width:auto;padding:8px 12px;margin:0;font-size:13px}.btn.r{background:var(--bad)}.btn.o{background:transparent;color:var(--tx);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center;font-size:12px;cursor:pointer;color:var(--tx)}
.q svg{display:block;margin:0 auto 4px;color:var(--gold)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--bg);flex:none}
.row .m{flex:1;min-width:0}.row .m small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.in{color:var(--ok);font-weight:700}.out{color:var(--bad);font-weight:700}
.tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs div{flex:1;text-align:center;padding:9px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--mut)}.tabs .on{background:var(--card);color:var(--tx)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px #0003;border-radius:30px;padding:8px;display:flex;gap:4px;z-index:5;max-width:calc(100% - 20px)}
nav button{border:0;background:none;color:var(--mut);display:flex;align-items:center;gap:6px;padding:11px 13px;border-radius:22px;font-weight:700;font-size:13px;cursor:pointer;transition:.3s;position:relative}
nav button span{max-width:0;overflow:hidden;white-space:nowrap;transition:.3s}
nav button.on{background:var(--navy);color:#fff}nav button.on span{max-width:80px}
nav button.on:after{content:"";position:absolute;bottom:-5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--gold)}
#md{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:9}
#md.on{display:flex}#md>div{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#ts{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;display:none;font-weight:600;max-width:90%}
.auth{padding-top:30px;text-align:center}.auth svg.lg{width:110px;margin:0 auto 6px;display:block}.auth .card{text-align:left}
.mut{color:var(--mut);font-size:13px}.tag{font-size:11px;background:var(--bg);padding:2px 8px;border-radius:8px;color:var(--gold);font-weight:700}
.tbl{overflow-x:auto}
nav button{transition:.3s,transform .15s}
nav button:active{transform:scale(.85)}
nav button.on{animation:navpop .5s cubic-bezier(.34,1.56,.64,1)}
nav button.on svg{animation:ico .55s cubic-bezier(.34,1.56,.64,1)}
nav button.on span{animation:lbl .35s ease-out}
nav button.on:after{animation:dot .4s .15s both}
@keyframes navpop{from{transform:scale(.8)}}
@keyframes ico{0%{transform:translateY(8px) scale(.6) rotate(-20deg)}60%{transform:translateY(-4px) scale(1.25)}}
@keyframes lbl{from{max-width:0;opacity:0}}
@keyframes dot{from{transform:scale(0)}}
.btn,.q{transition:transform .15s,filter .15s}
.btn:active{transform:scale(.95);filter:brightness(.88)}
.q:active{transform:scale(.9);background:var(--bg)}
.tabs div{transition:.2s}.tabs div:active{transform:scale(.94)}
.hero:active{transform:scale(.98)}.hero{transition:transform .15s}
.card{animation:fade .35s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.lg{display:inline-grid;place-items:center;background:#fff;border-radius:12px;flex:none;box-shadow:0 3px 10px #0003}.lg img{display:block}
.lgf{display:inline-block;background:#fff;border-radius:22px;padding:12px 18px;box-shadow:0 8px 22px #0003}.lgf img{display:block;width:170px;height:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:13px;font-weight:700;margin-top:8px;min-height:18px;color:var(--gold)}
.spin{font:800 46px system-ui,sans-serif;margin:16px 0 4px;color:var(--navy)}
.coin{width:170px;height:170px;border-radius:50%;border:0;margin:16px auto;display:block;background:radial-gradient(circle at 35% 30%,#ffe9a3,#e0b54f 60%,#b98a2e);box-shadow:0 10px 24px #0004;touch-action:manipulation;cursor:pointer}.coin:active{transform:scale(.93)}
select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
.as{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.as:last-child{border:0}
.sym{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:11px;background:var(--bg);color:var(--navy);flex:none}
.am{flex:1;min-width:0}.am small{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up{color:var(--ok)}.dn{color:var(--bad)}.chart{width:100%;height:150px;margin-top:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.g6 .btn{width:100%;padding:9px 0;margin:0}.g3 .btn{padding:12px 4px}
nav{gap:2px}nav button{padding:11px 12px}
.cp{background:linear-gradient(160deg,#0a1d3e,#0b2c3a);color:#eaf2fb;border:1px solid #ffffff1a}.cp .mut{color:#9fb3c8}.cp .up{color:#4ee0a0}.cp .dn{color:#ff6b6b}
.cwrap{position:relative}.chart2{width:100%;height:auto;touch-action:pan-y;display:block}
.cl{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s ease forwards}@keyframes draw{to{stroke-dashoffset:0}}@keyframes fadeIn{from{opacity:0}}
.ctip{position:absolute;top:0;background:#000c;border:1px solid #ffffff33;border-radius:10px;padding:5px 9px;font-size:12px;pointer-events:none;flex-direction:column;color:#fff}.ctip b{display:block}.ctip span{font-size:10px;color:#9fb3c8}
.cx{display:flex;justify-content:space-between;font-size:11px;color:#9fb3c8;margin-top:2px}
.tfs{display:inline-flex;background:#00000040;border-radius:20px;padding:3px;margin:12px 0}.tfs span{padding:6px 14px;border-radius:16px;font-weight:800;font-size:12px;color:#9fb3c8;cursor:pointer;transition:.2s}.tfs .on{background:linear-gradient(135deg,#f0cd72,#c19d57);color:#2a2008}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.st div{background:#ffffff12;border-radius:12px;padding:9px 10px}.st small{display:block;color:#9fb3c8;font-size:11px}.st b{font-size:14px}
.tk{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 12px;margin:0 -2px}.tkc{flex:0 0 150px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;cursor:pointer;transition:.2s}.tkc.on{border-color:#c19d57;box-shadow:0 0 0 2px #c19d5755}.tkc b{font-size:13px}.tkp{font-weight:800;font-size:15px;margin:2px 0}.tkb{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:14px}.seg div{flex:1;text-align:center;padding:11px;border-radius:11px;font-weight:800;cursor:pointer;color:var(--mut);transition:.25s}.seg .on{background:var(--ok);color:#fff}.seg .on.s{background:var(--bad)}.seg .dis{opacity:.45}
.pre{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}.pre span{text-align:center;padding:10px 0;border-radius:12px;background:var(--bg);font-weight:800;font-size:13px;cursor:pointer;border:1px solid var(--line);transition:.15s}.pre span:active{transform:scale(.94)}.pre span.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.bd{background:var(--bg);border-radius:14px;padding:4px 14px;margin:6px 0}.bd div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.bd div:last-child{border:0;font-size:16px}.bd span{color:var(--mut)}
.okc{width:96px;height:96px;display:block;margin:6px auto 0;animation:okpop .5s cubic-bezier(.3,1.6,.5,1)}.okc1{stroke:var(--ok);stroke-width:3;stroke-dasharray:151;stroke-dashoffset:151;animation:dr2 .6s ease forwards}.okc2{stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:dr2 .4s .5s ease forwards}
@keyframes dr2{to{stroke-dashoffset:0}}@keyframes okpop{from{transform:scale(.4);opacity:0}}
.okt{background:var(--bg);border-radius:14px;padding:2px 14px;margin-bottom:6px;animation:fadeIn .6s .7s both}.okt div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}.okt div:last-child{border:0}.okt span{color:var(--mut)}.okt b{text-align:right}
.okh{text-align:center;margin:10px 0 14px;animation:fadeIn .5s .45s both}
</style></head><body>
<main id="app"></main><div id="md"></div><div id="ts"></div>

 const el=$('#sp'),iv=setInterval(()=>{if(el)el.textContent=money([25,50,100,250,500,1000][Math.floor(Math.random()*6)])},90);
 try{const j=await api('game/spin','POST');await new Promise(r=>setTimeout(r,1800));clearInterval(iv);S.lastPrize=j.prize;S.gs={...g,sp:Date.now()+j.wait*1000};toast('Kamu dapat '+money(j.prize)+'!');await refresh()}catch(e){clearInterval(iv);if(el)el.textContent=S.lastPrize?money(S.lastPrize):'?'}busy=false}
async function tapStart(){if(busy||S.tapOn)return;const g=S.gs||{};if(wait(g.tp||0)>0)return toast('Tap Koin tersedia lagi dalam '+fmtw(wait(g.tp)));
 try{await api('game/tap_start','POST')}catch(e){return}
 S.tapOn=true;S.tapN=0;S.tapT=15;render();
 S.tapIv=setInterval(()=>{S.tapT--;const e=$('#tt');if(e)e.textContent=Math.max(0,S.tapT)+' dtk';if(S.tapT<=0){clearInterval(S.tapIv);tapEnd()}},1000)}

function spark(a,c,w,h){w=w||64;h=h||28;if(!a||a.length<2)return '<span style="width:'+w+'px"></span>';const mn=Math.min(...a),mx=Math.max(...a),sp=(mx-mn)||1;
 const pts=a.map((x,i)=>(i*(w-2)/(a.length-1)+1).toFixed(1)+','+(h-2-(x-mn)/sp*(h-4)).toFixed(1)).join(' ');
 return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${c>=0?'var(--ok)':'var(--bad)'}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`}
const fpc=v=>v>=1000?Math.round(v).toLocaleString('en-US'):v>=100?v.toFixed(1):v>=1?v.toFixed(2):v.toFixed(4);
function rangePts(h){if(!h)return null;const ms={'6':6,'24':24}[S.tf||'24'];if(!ms)return h;const f=h.filter(d=>d.t>=Date.now()-ms*36e5);return f.length>=2?f:h.slice(-2)}
function chartStats(hh,r){const h=rangePts(hh);if(!h||!h.length)return {o:r.price,h:r.price,l:r.price};const ps=h.map(d=>d.p);return {o:ps[0],h:Math.max(...ps),l:Math.min(...ps)}}
function chart(hh){if(!hh)return '<div class="mut" style="padding:70px 0;text-align:center">Memuat grafik…</div>';const h=rangePts(hh);if(h.length<2)return '<div class="mut" style="padding:70px 0;text-align:center">Belum ada data grafik</div>';
 const W=340,Hh=190,L=8,R=62,T=14,B=8,pw=W-L-R,ph=Hh-T-B,ps=h.map(d=>d.p);let mn=Math.min(...ps),mx=Math.max(...ps);if(mx===mn){mx+=(mx*.01)||1;mn-=(mn*.01)||1}const pd=(mx-mn)*.12;mn-=pd;mx+=pd;
 const X=i=>L+i*pw/(h.length-1),Y=v=>T+(mx-v)/(mx-mn)*ph,P2=h.map((d,i)=>[X(i),Y(d.p)]),cl=y=>Math.min(Hh,Math.max(0,y));
 let dd='M'+P2[0][0].toFixed(1)+','+P2[0][1].toFixed(1);
 for(let i=0;i<P2.length-1;i++){const p0=P2[i-1]||P2[i],p1=P2[i],p2=P2[i+1],p3=P2[i+2]||p2;dd+=' C'+(p1[0]+(p2[0]-p0[0])/6).toFixed(1)+','+cl(p1[1]+(p2[1]-p0[1])/6).toFixed(1)+' '+(p2[0]-(p3[0]-p1[0])/6).toFixed(1)+','+cl(p2[1]-(p3[1]-p1[1])/6).toFixed(1)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1)}
 const up=ps[ps.length-1]>=ps[0],c=up?'#4ee0a0':'#ff6b6b',last=P2[P2.length-1];
 const grid=[0,1,2,3].map(k=>{const v=mx-(mx-mn)*k/3,y=T+ph*k/3;return `<line x1="${L}" x2="${W-R+4}" y1="${y}" y2="${y}" stroke="#ffffff22" stroke-dasharray="3 4"/><text x="${W-R+8}" y="${y+3}" fill="#9fb3c8" font-size="9">${fpc(v)}</text>`}).join('');
 const fm=t=>(S.tf||'24')==='all'?new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
 S.cd={h,L,pw,W,X,Y};
 return `<div class="cwrap"><svg class="chart2" viewBox="0 0 ${W} ${Hh}" onpointermove="cMove(event)" onpointerdown="cMove(event)" onpointerleave="cOut()" onpointerup="cOut()"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient><filter id="glw" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>${grid}
 <path d="${dd} L${last[0].toFixed(1)},${T+ph} L${L},${T+ph} Z" fill="url(#cg)" style="animation:fadeIn 1s both"/>
 <path d="${dd}" pathLength="1" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glw)" class="cl"/>
 <line id="cx" x1="0" x2="0" y1="${T}" y2="${T+ph}" stroke="#ffffff66" style="display:none"/><circle id="cdot" r="5" fill="${c}" stroke="#fff" stroke-width="2" style="display:none"/>
 <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="${c}"><animate attributeName="r" values="4;10;4" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;.15;.9" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="${c}"/>
 <rect x="${W-R+2}" y="${(last[1]-9).toFixed(1)}" width="${R-4}" height="18" rx="9" fill="${c}"/><text x="${W-R/2}" y="${(last[1]+3.5).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="800" fill="#06241a">${fpc(ps[ps.length-1])}</text></svg><div id="ctip" class="ctip" style="display:none"></div></div>
 <div class="cx"><span>${fm(h[0].t)}</span><span>${fm(h[Math.floor(h.length/2)].t)}</span><span>kini</span></div>`}
function cMove(ev){const c=S.cd;if(!c)return;const r=ev.currentTarget.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*c.W;let i=Math.round((x-c.L)/c.pw*(c.h.length-1));i=Math.max(0,Math.min(c.h.length-1,i));
 const d=c.h[i],px=c.X(i),py=c.Y(d.p),cx=$('#cx'),dot=$('#cdot'),tip=$('#ctip');if(!cx||!tip)return;
 cx.setAttribute('x1',px);cx.setAttribute('x2',px);cx.style.display='';dot.setAttribute('cx',px);dot.setAttribute('cy',py);dot.style.display='';
 tip.style.display='flex';tip.innerHTML='<b>'+fp(d.p)+'</b><span>'+new Date(d.t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'</span>';tip.style.left=Math.min(70,Math.max(1,px/c.W*100-12))+'%'}

 const h=M.hold.find(x=>x.id===r.id),val=h?Math.floor(h.qty*r.price):0,pl=h?val-h.cost:0,side=(S.side==='sell'&&h)?'sell':'buy',up=r.chg>=0,st=chartStats(S.hist,r);

async function mv(id,pct){if(busy)return;busy=true;try{const j=await api('admin/asset/move','POST',{id,pct});toast('Harga sekarang '+fp(j.price));await refresh();assetMgr(id)}catch(e){}busy=false}
function mvc(id,sg){const p=Math.abs(+v('mpct'));if(!(p>0))return toast('Isi persen dulu');mv(id,sg*p)}
async function setp(id){const price=+v('mset');if(!(price>=0.01))return toast('Harga minimal $0,01');if(busy)return;busy=true;try{const j=await api('admin/asset/set','POST',{id,price});toast('Harga diatur '+fp(j.price));await refresh();assetMgr(id)}catch(e){}busy=false}
async function cfg(id){const vol=+v('mvol');if(!(vol>=0&&vol<=20))return toast('Gerak otomatis 0 sampai 20');if(busy)return;busy=true;try{await api('admin/asset/cfg','POST',{id,vol,auto:v('mau')==='1'});toast('Pengaturan disimpan');await refresh();assetMgr(id)}catch(e){}busy=false}
function delAsset(id){const r=(S.am||[]).find(x=>x.id===id);if(!r)return;modal(`<h3>Hapus ${esc(r.name)}?</h3><p class="mut">Semua yang memegang aset ini otomatis dicairkan ke saldo sesuai harga sekarang.</p><button class="btn r" onclick="doDelAsset(${id})">Ya, Hapus</button><button class="btn o" onclick="closeM()">Batal</button>`)}
async function doDelAsset(id){closeM();try{await api('admin/asset/'+id,'DELETE');toast('Aset dihapus, pemegang dicairkan');await refresh()}catch(e){}}
const ago=t=>{const m=Math.max(0,Math.floor((Date.now()-t)/60000));return m<1?'baru saja':m<60?m+' menit lalu':m<1440?Math.floor(m/60)+' jam lalu':Math.floor(m/1440)+' hari lalu'};
function newsRow(n,adm){return `<div class="row"><div class="m"><b>${esc(n.headline)}</b><small>${ago(n.t)} · ${esc(n.sym)}${n.auto?' · otomatis':''}</small></div><b class="${n.pct>=0?'up':'dn'}">${n.pct>=0?'▲':'▼'} ${Math.abs(n.pct)}%</b>${adm?`<button class="btn o s" onclick="newsDel(${n.id})">×</button>`:''}</div>`}
function newsCard(){const N=(S.news&&S.news.rows)||[];if(!N.length)return '';return `<div class="card"><h3>Berita Pasar</h3>${N.slice(0,8).map(n=>newsRow(n)).join('')}</div>`}
function newsFor(r){const N=((S.news&&S.news.rows)||[]).filter(n=>n.aid===r.id||n.sym==='PASAR').slice(0,4);if(!N.length)return '';return `<div class="card"><h3>Berita ${esc(r.sym)}</h3>${N.map(n=>newsRow(n)).join('')}</div>`}
function newsAdmin(R){const N=(S.news&&S.news.rows)||[],on=S.news?S.news.on:true;
 return `<div class="card"><h3>Berita Pasar</h3><div class="mut" style="margin:-6px 0 6px">Berita yang diterbitkan langsung menggerakkan harga.</div><label>Aset</label><select id="ns"><option value="">Semua aset (kabar pasar)</option>${R.map(r=>`<option value="${r.id}">${esc(r.name)} (${esc(r.sym)})</option>`).join('')}</select><label>Judul berita</label><input id="nh" maxlength="120" placeholder="mis. Pertamina umumkan laba besar"><label>Dampak ke harga (%), negatif untuk turun</label><input id="nq" type="number" step="any" placeholder="mis. 8 atau -5"><button class="btn g" onclick="newsPost()">Terbitkan Berita</button>
 <div style="height:1px;background:var(--line);margin:16px 0 4px"></div><div class="row"><div class="m"><b>Berita otomatis</b><small>Peristiwa acak ±2–8% muncul sesekali</small></div><button class="btn ${on?'':'o'} s" onclick="newsAuto(${on?0:1})">${on?'Aktif':'Mati'}</button></div>${N.slice(0,8).map(n=>newsRow(n,true)).join('')}</div>`}
async function newsPost(){const pct=+v('nq'),hd=v('nh').trim(),aid=v('ns');if(hd.length<3)return toast('Isi judul berita');if(!(pct!==0&&pct>-100&&pct<=1000))return toast('Isi dampak persen (bukan 0)');if(busy)return;busy=true;
 try{await api('admin/news','POST',{asset:aid?+aid:null,headline:hd,pct});toast('Berita terbit, harga berubah');await refresh()}catch(e){}busy=false}
async function newsDel(id){if(busy)return;busy=true;try{await api('admin/news/'+id,'DELETE');await refresh()}catch(e){}busy=false}
async function newsAuto(on){if(busy)return;busy=true;try{await api('admin/news_auto','POST',{on:!!on});toast(on?'Berita otomatis aktif':'Berita otomatis dimatikan');await refresh()}catch(e){}busy=false}
boot();
</script></body></html>
